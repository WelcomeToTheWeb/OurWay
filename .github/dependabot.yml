# Dependency refresh policy.
#
# The 2026-11-14 audit found no watcher at all here - no dependabot, no
# renovate - and the cost was silent drift: node 22 against a 26 LTS,
# postgres 16 against 18, gin 1.10.0 carrying 122 unfixed advisories in
# golang.org/x/net through its own dependency, and CI actions 2-3 majors
# behind. This file is the watcher.
#
# Shape of it:
#   * patches and minors land on their own, grouped into one PR per
#     ecosystem;
#   * majors arrive only where nobody has decided to defer them;
#   * the `ignore` blocks encode decisions already taken, so the bot does
#     not reopen a settled question every Monday. Take a deferred major by
#     deleting its `ignore` entry and landing the upgrade as its own change
#     with `scripts/release.sh --check` green - do not hand-edit a range
#     and move on.
#
# Security, stated rather than buried: the two critical advisories in `web`
# (tinypool prototype-pollution RCE via vitest, and the Vitest UI arbitrary
# file read) are fixed only by the vitest 5 / vite 8 majors, deferred below.
# They are dev/CI-time - nothing in `web/dist` references either package -
# but they are not zero, and they stay open until those majors are taken.
#
# Commits follow CONTRIBUTING.md: conventional prefix, imperative, no
# trailing period.
version: 2
updates:
  # Go: two entries, because they are two modules.
  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - go
      - server
    commit-message:
      prefix: chore(deps)
    groups:
      patch-and-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /agent
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - go
      - agent
    commit-message:
      prefix: chore(deps)
    groups:
      patch-and-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Console.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    # Keeps the `^` ranges the repo already uses.
    versioning-strategy: increase
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - web
    commit-message:
      prefix: chore(deps)
    groups:
      patch-and-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Deliberate majors - each is a planned migration, not an oversight.
      # React 19 also gates @types/react, @types/react-dom and recharts 3.
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react"
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react-dom"
        update-types: [version-update:semver-major]
      - dependency-name: react-router-dom
        update-types: [version-update:semver-major]
      - dependency-name: recharts
        update-types: [version-update:semver-major]
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: vite
        update-types: [version-update:semver-major]
      - dependency-name: vitest
        update-types: [version-update:semver-major]
      - dependency-name: "@vitest/*"
        update-types: [version-update:semver-major]
      - dependency-name: "@vitejs/plugin-react"
        update-types: [version-update:semver-major]
      - dependency-name: lucide-react
        update-types: [version-update:semver-major]
      - dependency-name: jsdom
        update-types: [version-update:semver-major]
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  # Container images and the compose files.
  - package-ecosystem: docker
    directories:
      - /
      - /docker
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: chore(deps)
    groups:
      patch-and-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # A database or cache MAJOR is an upgrade-path decision for the
      # operator, so it belongs with docs/upgrade-guide.md, not with a
      # weekly bot PR. Patch and minor rebuilds (the security ones) still
      # arrive.
      - dependency-name: postgres
        update-types: [version-update:semver-major]
      - dependency-name: redis
        update-types: [version-update:semver-major]
      # node MAJOR moves the build runtime for web and needs the e2e suite
      # re-proven, not just a green build.
      - dependency-name: node
        update-types: [version-update:semver-major]

  # CI. Majors included on purpose: an action MAJOR here is a runner change,
  # not an operator-facing upgrade, and this lane sat 2-3 majors stale with
  # nobody watching it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: chore(deps)
    groups:
      all:
        patterns:
          - "*"
