name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: welcometotheweb/ourway

# One workflow run publishes at a time. A tag and its main push race each
# other on the same package (both push server:latest / server:edge from the
# same commit), and GHCR answers that race with "unknown blob" mid-push.
concurrency:
  group: ghcr-publish
  cancel-in-progress: false

jobs:
  # Build agent binaries for all platforms
  build-agents:
    name: Build Agent Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          # Multi-module repo: without this the Go cache silently restores
          # nothing ("Dependencies file is not found ... go.sum").
          cache-dependency-path: |
            go.work.sum
            server/go.sum
            agent/go.sum

      - name: Resolve agent dependencies
        run: go mod tidy -C agent

      - name: Build agents
        run: |
          # One place derives the version: scripts/version.sh. On a tag push it
          # is the exact tag (git describe can race the tag push and emit a
          # vX.Y.Z-N-gSHA pseudo-version); on main it is a prerelease stamp.
          chmod +x scripts/version.sh scripts/release.sh
          VERSION=$(scripts/version.sh)
          GIT_COMMIT=$(scripts/version.sh --commit)
          BUILD_TIME=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          echo "Building at version $VERSION (commit $GIT_COMMIT)"
          mkdir -p dist/agents

          for platform in "linux/amd64" "linux/arm64" "darwin/amd64" "darwin/arm64" "windows/amd64"; do
            os="${platform%%/*}"
            arch="${platform##*/}"
            suffix=""
            if [ "$os" = "windows" ]; then
              suffix=".exe"
            fi
            echo "Building agent for $os/$arch..."
            GOOS=$os GOARCH=$arch go build -C agent \
              -ldflags "-s -w -X ourway/agent/config.Version=$VERSION" \
              -o "../dist/agents/ourway-agent-${os}-${arch}${suffix}" .
            echo "Building remote-control exe for $os/$arch..."
            gui=""
            if [ "$os" = "windows" ]; then
              gui="-H windowsgui"
            fi
            GOOS=$os GOARCH=$arch go build -C agent \
              -ldflags "-s -w $gui -X ourway/agent/config.Version=$VERSION" \
              -o "../dist/agents/ourway-remote-${os}-${arch}${suffix}" ./cmd/ourway-remote
          done

          echo "Building native viewer (Windows only)..."
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -C cmd/ourway-viewer \
            -ldflags "-s -w -H windowsgui" \
            -o "../../dist/agents/ourway-viewer-windows-amd64.exe" .

          echo "Building installers..."
          for platform in "linux/amd64" "linux/arm64" "darwin/amd64" "darwin/arm64" "windows/amd64"; do
            os="${platform%%/*}"
            arch="${platform##*/}"
            suffix=""
            if [ "$os" = "windows" ]; then
              suffix=".exe"
            fi
            echo "Building installer for $os/$arch..."
            cp "dist/agents/ourway-agent-${os}-${arch}${suffix}" cmd/ourway-installer/assets/agent
            GOOS=$os GOARCH=$arch go build -C cmd/ourway-installer \
              -ldflags "-s -w -X main.version=$VERSION -X 'main.buildTime=$BUILD_TIME' -X main.gitCommit=$GIT_COMMIT" \
              -o "../dist/agents/ourway-installer-${os}-${arch}${suffix}" .
          done

          echo "Built agents and installers:"
          ls -la dist/agents/

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: agent-binaries
          path: |
            dist/agents/ourway-agent-*
            dist/agents/ourway-installer-*
            dist/agents/ourway-viewer-*

  # Test gate: build, vet and test every Go module, plus the web
  # build (tsc + vite). Images are only pushed when this is green.
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          # Multi-module repo: without this the Go cache silently restores
          # nothing ("Dependencies file is not found ... go.sum").
          cache-dependency-path: |
            go.work.sum
            server/go.sum
            agent/go.sum

      - name: Resolve agent dependencies
        run: go mod tidy -C agent

      - name: Server (build, vet, test)
        run: |
          go -C server build ./...
          go -C server vet ./...
          go -C server test -race ./...

      - name: Agent (build, vet, test)
        run: |
          go -C agent build ./...
          go -C agent vet ./...
          go -C agent test -race ./...

      - name: CLI and installer (build)
        run: |
          go -C cmd/ourway-cli build ./...
          go -C cmd/ourway-installer build ./...

      - name: Viewer (vet, test, Windows build)
        run: |
          go -C cmd/ourway-viewer vet ./...
          go -C cmd/ourway-viewer test -race ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go -C cmd/ourway-viewer vet ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go -C cmd/ourway-viewer build -o /dev/null .

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web (unit tests + tsc + vite build)
        run: |
          npm ci --prefix web
          npm test --prefix web -- --run
          npm run build --prefix web

      # 2.2-0: coverage is a floor you cannot silently undo. The baseline lives in
      # coverage.baseline.json; raising it is a commit decision, not a drift.
      - name: Coverage ratchet
        run: |
          chmod +x scripts/coverage.sh
          scripts/coverage.sh

  # Build and push server Docker image
  build-server-image:
    name: Build Server Image
    needs: [build-agents, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download agent binaries
        uses: actions/download-artifact@v4
        with:
          name: agent-binaries
          path: dist/agents/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version and image tags
        id: meta
        run: |
          chmod +x scripts/version.sh
          VERSION=$(scripts/version.sh)
          CHANNEL=$(scripts/version.sh --channel)
          COMMIT=$(scripts/version.sh --commit)
          MINOR=$(printf '%s' "$VERSION" | cut -d- -f1 | cut -d. -f1,2)
          base=${REGISTRY}/${IMAGE_PREFIX}/server
          # Image tags carry the v prefix, matching the git tag and the
          # v1.5.x / v2.0.x tags already published in the registry.
          if [ "$CHANNEL" = stable ]; then
            tags="$base:v$VERSION"$'\n'"$base:$MINOR"$'\n'"$base:latest"
          else
            tags="$base:edge"$'\n'"$base:main-$COMMIT"
          fi
          {
            echo "version=$VERSION"
            echo "commit=$COMMIT"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "publishing server for channel $CHANNEL:"
          echo "$tags"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.server
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            GIT_COMMIT=${{ steps.meta.outputs.commit }}

  # Build and push web Docker image
  build-web-image:
    name: Build Web Image
    needs: [build-agents, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version and image tags
        id: meta
        run: |
          chmod +x scripts/version.sh
          VERSION=$(scripts/version.sh)
          CHANNEL=$(scripts/version.sh --channel)
          COMMIT=$(scripts/version.sh --commit)
          MINOR=$(printf '%s' "$VERSION" | cut -d- -f1 | cut -d. -f1,2)
          base=${REGISTRY}/${IMAGE_PREFIX}/web
          # Image tags carry the v prefix, matching the git tag and the
          # v1.5.x / v2.0.x tags already published in the registry.
          if [ "$CHANNEL" = stable ]; then
            tags="$base:v$VERSION"$'\n'"$base:$MINOR"$'\n'"$base:latest"
          else
            tags="$base:edge"$'\n'"$base:main-$COMMIT"
          fi
          {
            echo "version=$VERSION"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "publishing web for channel $CHANNEL:"
          echo "$tags"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.web
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}

  # Create GitHub release on tags
  release:
    name: Create Release
    needs: [build-agents, build-server-image, build-web-image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download agent binaries
        uses: actions/download-artifact@v4
        with:
          name: agent-binaries
          path: dist/agents/

      # Notes come from the changelog section for this version, so the
      # release says what changed for an operator. GitHub's generated notes
      # list merged PRs only, so work pushed straight to main is invisible
      # there. Fallback keeps generated notes when a section is missing.
      - name: Assemble release notes
        id: notes
        run: |
          chmod +x scripts/version.sh
          VERSION=$(scripts/version.sh)
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          {
            echo "## OurWay $VERSION"
            echo
            awk -v want="[$VERSION]" '
              /^## \[/ { if (found) exit; found = (index($0, want) > 0); next }
              found { print }
            ' docs/changelog.md
            echo
            if [ -n "$PREV" ]; then
              echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/${PREV}...v$VERSION"
            fi
          } > release-notes.md
          if grep -q "###" release-notes.md; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi
          head -20 release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: ${{ steps.notes.outputs.has_notes != 'true' }}
          body_path: ${{ steps.notes.outputs.has_notes == 'true' && 'release-notes.md' || '' }}
          files: |
            dist/agents/ourway-agent-*
            dist/agents/ourway-installer-*
            install.sh
            install.ps1
