name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: welcometotheweb/ourway

jobs:
  # Build agent binaries for all platforms
  build-agents:
    name: Build Agent Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Resolve agent dependencies
        run: go mod tidy -C agent

      - name: Build agents
        run: |
          # On tag pushes use the exact tag (git describe can race the
          # tag push and emit a vX.Y.Z-N-gSHA pseudo-version).
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "0.0.0-dev")
          fi
          GIT_COMMIT=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          mkdir -p dist/agents

          for platform in "linux/amd64" "linux/arm64" "darwin/amd64" "darwin/arm64" "windows/amd64"; do
            os="${platform%%/*}"
            arch="${platform##*/}"
            suffix=""
            if [ "$os" = "windows" ]; then
              suffix=".exe"
            fi
            echo "Building agent for $os/$arch..."
            GOOS=$os GOARCH=$arch go build -C agent \
              -ldflags "-s -w -X ourway/agent/config.Version=$VERSION" \
              -o "../dist/agents/ourway-agent-${os}-${arch}${suffix}" .
            if [ "$os" = "windows" ]; then
              echo "Building remote-control exe for $os/$arch..."
              GOOS=$os GOARCH=$arch go build -C agent \
                -ldflags "-s -w -H windowsgui -X ourway/agent/config.Version=$VERSION" \
                -o "../dist/agents/ourway-remote-${os}-${arch}${suffix}" ./cmd/ourway-remote
            fi
          done

          echo "Building installers..."
          for platform in "linux/amd64" "linux/arm64" "darwin/amd64" "darwin/arm64" "windows/amd64"; do
            os="${platform%%/*}"
            arch="${platform##*/}"
            suffix=""
            if [ "$os" = "windows" ]; then
              suffix=".exe"
            fi
            echo "Building installer for $os/$arch..."
            cp "dist/agents/ourway-agent-${os}-${arch}${suffix}" cmd/ourway-installer/assets/agent
            GOOS=$os GOARCH=$arch go build -C cmd/ourway-installer \
              -ldflags "-s -w -X main.version=$VERSION -X 'main.buildTime=$BUILD_TIME' -X main.gitCommit=$GIT_COMMIT" \
              -o "../dist/agents/ourway-installer-${os}-${arch}${suffix}" .
          done

          echo "Built agents and installers:"
          ls -la dist/agents/

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: agent-binaries
          path: |
            dist/agents/ourway-agent-*
            dist/agents/ourway-installer-*

  # Test gate: build, vet and test every Go module, plus the web
  # build (tsc + vite). Images are only pushed when this is green.
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Resolve agent dependencies
        run: go mod tidy -C agent

      - name: Server (build, vet, test)
        run: |
          go -C server build ./...
          go -C server vet ./...
          go -C server test -race ./...

      - name: Agent (build, vet, test)
        run: |
          go -C agent build ./...
          go -C agent vet ./...
          go -C agent test -race ./...

      - name: CLI and installer (build)
        run: |
          go -C cmd/ourway-cli build ./...
          go -C cmd/ourway-installer build ./...

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web (unit tests + tsc + vite build)
        run: |
          npm ci --prefix web
          npm test --prefix web -- --run
          npm run build --prefix web

  # Build and push server Docker image
  build-server-image:
    name: Build Server Image
    needs: [build-agents, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download agent binaries
        uses: actions/download-artifact@v4
        with:
          name: agent-binaries
          path: dist/agents/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.server
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/server:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/server:${{ github.sha }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}/{1}/server:{2}', env.REGISTRY, env.IMAGE_PREFIX, github.ref_name) || '' }}
          build-args: |
            VERSION=${{ github.sha }}
            GIT_COMMIT=${{ github.sha }}

  # Build and push web Docker image
  build-web-image:
    name: Build Web Image
    needs: [build-agents, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.web
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/web:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/web:${{ github.sha }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}/{1}/web:{2}', env.REGISTRY, env.IMAGE_PREFIX, github.ref_name) || '' }}

  # Create GitHub release on tags
  release:
    name: Create Release
    needs: [build-agents, build-server-image, build-web-image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download agent binaries
        uses: actions/download-artifact@v4
        with:
          name: agent-binaries
          path: dist/agents/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/agents/ourway-agent-*
            dist/agents/ourway-installer-*
            install.sh
            install.ps1
