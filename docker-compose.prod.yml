name: ourway

# Images are published from tags only: :latest is always a stable release
# (docs/versioning.md). Pin X.Y.Z for a fleet that must not move on its own,
# or use :edge to follow main.

services:
  postgres:
    image: postgres:16-alpine
    container_name: ourway-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ourway
      POSTGRES_PASSWORD: ourway
      POSTGRES_DB: ourway
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ourway_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ourway -d ourway"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  server:
    image: ghcr.io/welcometotheweb/ourway/server:latest
    container_name: ourway-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: ":8080"
      DATABASE_URL: "postgresql://ourway:ourway@postgres:5432/ourway?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET:-ourway-secret-key-change-me}
      WS_PATH: "/ws"
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      # Mail transport (2.4-6). The server, its credentials and the sender belong
      # to the installation; **who** a channel writes to is set per channel in the
      # console. With no SMTP_HOST, email channels are refused at save time and
      # the console says why. Credentials come from the host environment and are
      # never given a committed default.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-ourway@localhost}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      # Session recording (2.4-8). off is the default: the installation records
      # nothing until the operator says so. RECORDINGS_DIR is media storage the
      # host owns — it is mounted below, and the server does not back it up.
      RECORD_SESSIONS: ${RECORD_SESSIONS:-off}
      RECORDINGS_DIR: ${RECORDINGS_DIR:-/var/lib/ourway/recordings}
      RECORDING_RETENTION_DAYS: ${RECORDING_RETENTION_DAYS:-30}
      TZ: UTC
    ports:
      - "8080:8080"
    networks:
      - ourway_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      # 2.4-8: the recording files outlive the container. A recording directory
      # inside the container is a recording directory that disappears with it,
      # which is the worst place for evidence to live.
      - recordings_data:/var/lib/ourway/recordings

  web:
    image: ghcr.io/welcometotheweb/ourway/web:latest
    container_name: ourway-web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "3000:8080"
    networks:
      - ourway_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ourway_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  recordings_data:
    driver: local
