name: ourway

services:
  postgres:
    image: postgres:16-alpine
    container_name: ourway-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ourway
      POSTGRES_PASSWORD: ourway
      POSTGRES_DB: ourway
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ourway_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ourway -d ourway"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  server:
    image: ghcr.io/welcometotheweb/ourway/server:latest
    container_name: ourway-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: ":8080"
      DATABASE_URL: "postgresql://ourway:ourway@postgres:5432/ourway?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET:-ourway-secret-key-change-me}
      WS_PATH: "/ws"
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      TZ: UTC
    ports:
      - "8080:8080"
    networks:
      - ourway_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: ghcr.io/welcometotheweb/ourway/web:latest
    container_name: ourway-web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "3000:8080"
    networks:
      - ourway_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ourway_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
